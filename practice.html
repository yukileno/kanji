<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>漢字チャレンジ</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff3b6b;--green:#16a34a;--orange:#ea580c;--red:#dc2626;--purple:#7c3aed;--blue:#2563eb;--ink:#1f2a44;--muted:#64748b;--gold:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:#fde2ec;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow-x:hidden}
#bg{position:fixed;inset:-20%;z-index:-1;background:linear-gradient(120deg,#fde2ec,#dbeafe,#fef3c7,#dcfce7,#fde2ec);background-size:400% 400%;animation:bgmove 20s ease infinite}
body.fever #bg{background:linear-gradient(120deg,#ff9a9e,#fecfef,#fbc2eb,#a1c4fd,#fde68a,#ff9a9e);background-size:400% 400%;animation:bgmove 2.5s ease infinite,hue 1.5s linear infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes hue{to{filter:hue-rotate(360deg) saturate(1.4)}}
.screen{display:none;max-width:1100px;margin:0 auto;padding:16px;flex-direction:column;align-items:center;gap:12px}
.screen.on{display:flex}
.card{background:#fffffff2;border-radius:24px;box-shadow:0 6px 20px #0001;padding:14px 18px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 18px;font-size:17px;background:#fff;color:var(--ink);box-shadow:0 2px 0 #0002,0 0 0 1px #0001;cursor:pointer}
button:active{transform:translateY(1px);box-shadow:none}
button:disabled{opacity:.5;cursor:default}
button.main{background:linear-gradient(180deg,#ff6b95,var(--pink));color:#fff;font-size:24px;padding:12px 44px;box-shadow:0 4px 0 #b3123f}
button.go{background:linear-gradient(180deg,#60a5fa,var(--blue));color:#fff;font-size:20px;padding:12px 30px;box-shadow:0 4px 0 #1e3a8a}
button.retry{background:linear-gradient(180deg,#fdba74,var(--orange));color:#fff;font-size:20px;padding:12px 26px;box-shadow:0 4px 0 #9a3412}
.corner{position:fixed;top:10px;right:10px;z-index:5}
.note{font-size:12px;color:var(--muted)}
@keyframes blink{50%{opacity:.4}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes pop{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.9)}}

/* ===== 演出 ===== */
@keyframes fxFlash{from{opacity:.75}to{opacity:0}}
.fx-shake{animation:fxShake .45s}
@keyframes fxShake{20%{transform:translate(-8px,3px) rotate(-1deg)}40%{transform:translate(7px,-3px) rotate(1deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
.fx-boing{animation:fxBoing .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes fxBoing{30%{transform:scale(1.06)}60%{transform:scale(.97)}}
.fx-fly{position:fixed;z-index:31;pointer-events:none;font-weight:900;font-size:40px;color:#fff;-webkit-text-stroke:2px #ff3b6b;paint-order:stroke fill;
  transform:translate(0,0);transition:transform .7s cubic-bezier(.5,-0.4,.7,1),opacity .7s;margin:-24px 0 0 -40px;white-space:nowrap}
#floaters{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#floaters span{position:absolute;bottom:-80px;font-family:"Klee One",serif;font-weight:600;color:#ffffff99;text-shadow:0 2px 8px #0001;animation:floatUp linear infinite}
@keyframes floatUp{to{transform:translateY(-120vh) rotate(25deg)}}
#bigText{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20}
#bigText span{font-size:clamp(56px,12vw,120px);font-weight:900;color:#fff;-webkit-text-stroke:4px #f43f5e;paint-order:stroke fill;text-shadow:0 8px 0 #9f1239aa;animation:bigIn 1.3s ease-out forwards;text-align:center}
@keyframes bigIn{0%{transform:scale(.2) rotate(-10deg);opacity:0}25%{transform:scale(1.1) rotate(3deg);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}
body.fever::before{content:"";position:fixed;left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;z-index:-1;pointer-events:none;
  background:repeating-conic-gradient(#ffffff26 0 8deg,transparent 8deg 20deg);animation:rays 6s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}

/* ===== ホーム ===== */
.title{margin:18px 0 0;font-size:clamp(40px,8vw,72px);font-weight:900;line-height:1.1;text-align:center;letter-spacing:.02em}
.title span{display:inline-block;animation:tBounce 1.8s ease-in-out infinite;color:#fff;
  -webkit-text-stroke:3px var(--c);paint-order:stroke fill;text-shadow:0 6px 0 var(--c),0 10px 18px #0003}
@keyframes tBounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-12px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.subtitle{font-weight:900;font-size:18px;color:#fff;background:linear-gradient(90deg,#ff3b6b,#a855f7,#3b9cff);border-radius:999px;padding:4px 18px;box-shadow:0 4px 0 #0002}
#profile{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;background:#fffd;border-radius:24px;padding:10px 20px;box-shadow:0 4px 0 #0001}
#profile .rank{font-size:22px;font-weight:900}
#profile .pts{font-size:20px;font-weight:900;color:#b45309}
#profile .lvbar{width:200px;height:12px;border-radius:999px;background:#e5e7eb;overflow:hidden}
#profile .lvbar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#ff3b6b,#a855f7)}
#profile .medals{font-size:18px;font-weight:900}
#profile small{display:block;font-size:12px;color:var(--muted);font-weight:800}

#units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;width:100%}
.unit{text-align:left;border-radius:22px;padding:14px 16px 14px 84px;display:flex;flex-direction:column;gap:6px;font-size:16px;cursor:pointer;
  border:0;background:linear-gradient(145deg,var(--u1,#fff),var(--u2,#fff));color:var(--ink);position:relative;overflow:hidden;min-height:118px;justify-content:center;
  box-shadow:0 6px 0 var(--u3,#0002),0 10px 20px #0002;animation:cardIn .5s cubic-bezier(.2,1.5,.4,1) both;transition:transform .15s,box-shadow .15s}
.unit b{font-size:19px}
.unit .meta{color:var(--muted);font-size:13px;font-weight:800}
.unit::before{content:var(--emo,"📘");position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:52px;filter:drop-shadow(0 4px 0 #0002);transition:transform .3s}
.unit:hover::before{transform:translateY(-50%) rotate(-12deg) scale(1.1)}
.unit::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff8 45%,transparent 60%);transform:translateX(-120%);pointer-events:none}
.unit.sel{transform:translateY(-4px) scale(1.02);box-shadow:0 6px 0 var(--u3,#0002),0 0 0 5px #fff,0 0 0 9px var(--pink),0 14px 30px #ff3b6b55}
.unit.sel::after{animation:shine 1.6s ease-in-out infinite}
.unit.sel::before{animation:emoWiggle 1s ease-in-out infinite}
@keyframes emoWiggle{50%{transform:translateY(-50%) rotate(12deg) scale(1.15)}}
.unit.all{grid-column:1/-1}
.unit.done{background:linear-gradient(145deg,#fff7c2,#fde68a)}
.unit.done b::after{content:" 👑";}
/* 単元カードのメダル枠 */
.slots{display:flex;gap:5px;flex-wrap:wrap}
.slot{font-size:12px;font-weight:900;border-radius:999px;padding:1px 9px;background:#fff9;color:#94a3b8;border:2px dashed #cbd5e1;white-space:nowrap}
.slot.clear{color:#fff;border:2px solid #fff;box-shadow:0 2px 0 #0002}
.slot.clear.easy{background:linear-gradient(180deg,#f59e0b,#b45309)}
.slot.clear.normal{background:linear-gradient(180deg,#cbd5e1,#64748b)}
.slot.clear.hard{background:linear-gradient(180deg,#fde047,#ca8a04)}

/* 下のバー: コースえらび＋スタート */
#home{padding-bottom:210px}
#startBar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px 18px;
  background:linear-gradient(transparent,#ffffffdd 30%);z-index:4}
#courseRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.course{display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:8px 18px;font-size:18px;border-radius:18px;min-width:150px;border:3px solid transparent}
.course small{font-size:12px;font-weight:800;color:var(--muted)}
.course.on{border-color:var(--pink);background:#fff0f4;box-shadow:0 4px 0 #ff3b6b55}
.course.locked{background:#e5e7eb;color:#94a3b8}
.course .ok{color:var(--green);font-size:12px}
#startBtn{position:relative;overflow:hidden;font-size:32px;padding:12px 70px;border-radius:999px;display:flex;flex-direction:column;align-items:center;line-height:1.2;
  background:linear-gradient(180deg,#ff7aa2,#ff3b6b 55%,#e11d48);box-shadow:0 8px 0 #9f1239,0 0 0 6px #fff,0 0 40px #ff3b6b99;animation:startPulse 1.2s ease-in-out infinite}
#startBtn small{font-size:14px;font-weight:800}
#startBtn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff9 45%,transparent 60%);animation:shine 2s ease-in-out infinite;pointer-events:none}
#startBtn:disabled{animation:none;filter:grayscale(1);opacity:.6}
@keyframes startPulse{50%{transform:scale(1.04);box-shadow:0 8px 0 #9f1239,0 0 0 6px #fff,0 0 70px #ff3b6bcc}}

/* ===== 問題 ===== */
#hud{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:6}
.pill{background:#fff;border-radius:999px;padding:6px 16px;font-weight:900;font-size:20px;box-shadow:0 2px 0 #0002;white-space:nowrap}
#courseTag{font-size:15px}
#hearts{font-size:26px;letter-spacing:2px;white-space:nowrap}
#hearts.lost{animation:fxShake .5s}
#score{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff7c2,#fde047);color:#7a3e00;border:3px solid #fff;
  border-radius:999px;padding:2px 20px;box-shadow:0 4px 0 #b45309;min-width:140px;text-align:center}
#score::before{content:"⭐ "}
#score.bump{animation:bump .4s}
#goalLine{font-weight:900;font-size:16px;color:var(--ink);background:#fffc;border-radius:999px;padding:4px 16px}
#goalLine.fail{color:var(--red)}
#streakBox{height:42px;display:flex;align-items:center;gap:10px}
#feverBadge{font-size:26px;font-weight:900;color:#fff;background:linear-gradient(90deg,#f43f5e,#f59e0b);border-radius:999px;padding:2px 20px;border:3px solid #fff;
  text-shadow:0 2px 0 #0003;box-shadow:0 0 16px #f59e0b;animation:feverPulse .6s ease-in-out infinite alternate}
@keyframes feverPulse{to{transform:scale(1.08)}}
#streak{font-size:22px;font-weight:900;color:#fff;-webkit-text-stroke:2px #ff3b6b;paint-order:stroke fill}
#streak.bump{animation:bump .4s}
#streakHint{font-size:15px;font-weight:800;color:var(--muted)}
#qHead{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
#qUnit{font-size:13px;font-weight:800;color:var(--muted)}
#qYomi{font-weight:900;letter-spacing:.06em;line-height:1.2;text-align:center;color:#fff;-webkit-text-stroke:3px #1f2a44;paint-order:stroke fill;
  text-shadow:0 6px 0 #1f2a44aa;font-size:clamp(40px,7vw,64px);animation:yomiIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes yomiIn{from{transform:scale(.4) rotate(-6deg);opacity:0}}
#qNote{font-size:18px;font-weight:800;color:var(--muted);min-height:1.4em;text-align:center}
#qNote mark{background:#fef08a;color:var(--ink);border-radius:4px;padding:0 3px}
#padArea{width:100%;display:flex;justify-content:center;position:relative}
.wpad{position:relative;background:#fff;border-radius:16px;box-shadow:0 8px 24px #0002,0 0 0 5px #fff;transition:box-shadow .3s}
.wpad canvas{position:absolute;inset:0;border-radius:16px}
.wpad canvas:last-child{touch-action:none;cursor:crosshair}
body.fever .wpad{box-shadow:0 8px 24px #0002,0 0 0 5px #fff,0 0 0 10px #fbbf24,0 0 30px #f59e0b}
#pop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;z-index:3}
#pop .pts{font-size:72px;font-weight:900;color:#fff;-webkit-text-stroke:3px var(--pink);paint-order:stroke fill;text-shadow:0 6px 0 #b3123f88;animation:popUp 1.1s ease-out forwards}
#pop .sub{font-size:22px;font-weight:900;color:var(--ink);background:#fffe;border-radius:999px;padding:2px 14px;display:inline-block;animation:popUp 1.1s ease-out forwards}
@keyframes popUp{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.15);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:translateY(-40px);opacity:0}}
#reviewCard{border:3px solid #fecaca}
#rvMsgs{margin:4px 0 0;padding-left:1.2em;font-weight:800;line-height:1.8;font-size:17px}
#dlg{position:fixed;inset:0;z-index:50;background:#0006;display:grid;place-items:center;padding:16px}
#dlg .box{background:#fff;border-radius:24px;padding:24px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px #0004}
#dlg p{font-size:22px;font-weight:900;margin:0 0 6px}
#dlg small{display:block;color:var(--muted);font-weight:800;margin-bottom:16px}

/* ===== 結果 ===== */
#sumTitle{font-size:24px;font-weight:900;margin:10px 0 0;text-align:center}
#sumBig{font-size:clamp(56px,12vw,104px);font-weight:900;color:#fff;-webkit-text-stroke:5px #ff3b6b;paint-order:stroke fill;text-shadow:0 10px 0 #9f1239;line-height:1.1;text-align:center;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
#sumBig.fail{-webkit-text-stroke-color:#64748b;text-shadow:0 10px 0 #334155}
#sumMedal{font-size:110px;line-height:1;animation:medalSpin 1.2s cubic-bezier(.2,1.4,.4,1)}
@keyframes medalSpin{from{transform:scale(0) rotateY(720deg)}}
#sumNews{display:flex;flex-direction:column;gap:6px;align-items:center}
#sumNews div{font-size:20px;font-weight:900;color:#fff;background:linear-gradient(90deg,#f43f5e,#f59e0b,#a855f7);padding:6px 22px;border-radius:999px;box-shadow:0 4px 0 #0003;animation:pop .7s both}
#sumStats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#sumStats div{background:#fff;border-radius:16px;padding:8px 16px;font-weight:900;box-shadow:0 2px 6px #0001;animation:cardIn .5s both}
#sumPts{font-size:28px;font-weight:900;color:#b45309}
#sumList{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;width:100%}
.si{background:#fff;border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 6px #0001;animation:cardIn .4s both}
.si .w{font-family:"Klee One",serif;font-size:24px}
.si .y{font-size:13px;color:var(--muted)}
.si .r{margin-left:auto;font-size:16px;font-weight:900;text-align:right}
</style>
</head>
<body>
<div id="bg"></div>
<div id="floaters"></div>
<div class="corner"><button id="soundBtn">🔊</button></div>

<!-- ===== ホーム ===== -->
<section id="home" class="screen on">
  <h1 class="title" id="title"></h1>
  <div class="subtitle">🏅 コースをクリアして メダルを集めよう!</div>
  <div id="profile"></div>
  <div id="units"></div>
  <p class="note" id="srcNote"></p>
  <div class="row note" style="gap:6px"><span id="logLine"></span>
    <button id="logSave" style="font-size:13px;padding:6px 12px">⬇ 記録を保存</button>
    <button id="logClear" style="font-size:13px;padding:6px 12px">記録を消す</button></div>
  <div id="startBar">
    <div id="courseRow"></div>
    <button class="main" id="startBtn">▶ スタート!<small id="startSel"></small></button>
  </div>
</section>

<!-- ===== 問題 ===== -->
<section id="play" class="screen">
  <div id="hud">
    <button id="quitBtn">✕ やめる</button>
    <div class="pill" id="prog">1 / 10</div>
    <div class="pill" id="courseTag"></div>
    <div id="hearts"></div>
    <div id="score">0</div>
  </div>
  <div id="goalLine"></div>
  <div id="streakBox">
    <span id="streakHint">一致率75%以上を 3回つづけると 🔥FEVER!</span>
    <span id="feverBadge" hidden></span>
    <span id="streak"></span>
  </div>
  <div id="qHead"><span id="qUnit"></span></div>
  <div id="qYomi"></div>
  <div id="qNote"></div>
  <div id="padArea"><div id="pad"></div><div id="pop"></div></div>
  <div class="row" id="tools">
    <button id="undoBtn">↩ もどす</button>
    <button id="clearBtn">🧽 ぜんぶけす</button>
  </div>
  <button class="main" id="judgeBtn">できた!</button>

  <!-- ❌のとき -->
  <div class="card" id="reviewCard" hidden>
    <div style="font-size:30px;font-weight:900;text-align:center;color:var(--red)">❌ ざんねん</div>
    <div id="rvAnswer" style="text-align:center;font-weight:900;font-size:20px"></div>
    <div id="rvHeart" style="text-align:center;font-weight:900;color:var(--red)"></div>
    <ul id="rvMsgs"></ul>
    <div class="row" style="margin-top:10px">
      <button id="rvAnim">🎬 正しい書き順</button>
      <button id="rvReplay">▶ 自分の書き方</button>
      <button id="rvFlag" style="font-size:14px">🙋 正しく書いたのに❌だった</button>
      <button class="go" id="rvNext">つぎへ ▶</button>
    </div>
  </div>
</section>

<!-- ===== 結果 ===== -->
<section id="summary" class="screen">
  <div id="sumTitle"></div>
  <div id="sumMedal" hidden></div>
  <div id="sumBig"></div>
  <div id="sumNews"></div>
  <div id="sumStats"></div>
  <div id="sumPts"></div>
  <div id="sumList"></div>
  <div class="row">
    <button class="go" id="sumNext" hidden>▶ つぎのコースへ</button>
    <button class="retry" id="sumAgain">🔁 もう一回</button>
    <button id="sumHome">🏠 はじめの画面へ</button>
  </div>
</section>

<div id="bigText"></div>
<div id="dlg" hidden><div class="box"><p id="dlgMsg"></p><small id="dlgSub"></small>
  <div class="row"><button class="retry" id="dlgYes">やめる</button><button class="go" id="dlgNo">つづける</button></div></div></div>

<script src="data/tests-g5-t2.js?v=20261004f"></script>
<script src="js/kanji-data.js?v=20261004f"></script>
<script src="js/judge.js?v=20261004f"></script>
<script src="js/pad.js?v=20261004f"></script>
<script src="js/fx.js?v=20261004f"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const TESTS = window.KANJI_TESTS;
const KEY = 'kanjiCourse.v1';

/* ===== ルール（数値はここで調整） ===== */
const RULE = {
  base: 100,                 // 1字あたりの基本点
  silver: 80, gold: 90,      // 一致率のしきい値（得点 ×2 / ×3）
  streakAt: 75,              // この一致率以上の正解が「れんぞく」になる
  feverFrom: 3,              // れんぞく何回で FEVER（×2）。そこから2回ごとに +1
  feverMax: 5,               // FEVER倍率の上限
  repeatRate: .5,            // 同じ日に同じ語をもう一度書いたときの点数の割合
  allCount: 20,              // 「ぜんぶの単元から」の問題数
  tolerance: 'superEasy',    // 判定のきびしさ（superEasy=激甘 / easy / normal / strict）
};
// コース: クリアに必要な正解の割合で差をつける（判定のきびしさは同じ）
const COURSES = [
  { id: 'easy', name: 'かんたん', medal: '🥉', rate: .6 },
  { id: 'normal', name: 'ふつう', medal: '🥈', rate: .8 },
  { id: 'hard', name: 'むずかしい', medal: '🥇', rate: 1 },
];
const RANKS = [[100000, '👑 漢字レジェンド'], [50000, '🏆 漢字マスター'], [25000, '🦸 漢字ヒーロー'], [10000, '⚔️ 漢字ファイター'], [3000, '🌱 漢字チャレンジャー'], [0, '🐣 漢字みならい']];

/* ===== 保存（この端末のブラウザに保存） ===== */
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
const store = Object.assign({ points: 0, clears: {}, best: {}, daily: { date: '', words: {} } }, load());
store.opt = Object.assign({ sound: 1, sel: 'u1', course: 'easy' }, store.opt);
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const today = () => new Date().toLocaleDateString('ja-JP');

/* ===== 効果音 ===== */
let AC = null;
function ac() { if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t, d, type = 'sine', v = .15) {
  const a = ac(); if (!a || !store.opt.sound) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + t;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + .05);
}
const SFX = {
  ok: m => { const b = 660 * Math.pow(1.06, Math.min(m, 8)); tone(b, 0, .12, 'triangle'); tone(b * 1.5, .08, .18, 'triangle'); },
  fever: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .07, .25, 'square', .08)),
  up: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .05, .2, 'square', .08)),
  ng: () => { tone(220, 0, .25, 'sawtooth', .07); tone(180, .15, .3, 'sawtooth', .07); },
  clear: () => [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * .1, .3, 'square', .09)),
  fail: () => [523, 494, 466, 440].forEach((f, i) => tone(f, i * .18, .35, 'triangle', .1)),
  pick: () => { tone(880, 0, .08, 'triangle', .1); tone(1320, .05, .1, 'triangle', .08); },
};

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function bigText(t) { const b = $('#bigText'); b.innerHTML = ''; const s = document.createElement('span'); s.textContent = t; b.appendChild(s); setTimeout(() => { if (b.firstChild === s) b.innerHTML = ''; }, 1300); }
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);

/* ===== ヒント文: 答えの漢字が入っていたら、よみがなに置きかえる ===== */
function maskNote(note, word, yomi) {
  if (!note) return '';
  let h = esc(note);
  const mark = `<mark>${esc(yomi)}</mark>`;
  if (note.includes(word)) h = h.split(esc(word)).join(mark);
  else {
    const kanji = [...word].filter(KanjiData.isKanji).join('');
    if (kanji && note.includes(kanji)) h = h.split(esc(kanji)).join(mark);
  }
  for (const ch of word) if (KanjiData.isKanji(ch)) h = h.split(ch).join('〇');
  return 'ヒント：' + h;
}

/* ===== 問題を表示して判定する ===== */
const pad = new WritingPad($('#pad'), { penMode: 'auto' });
let curItem = null, curTmpls = [];
async function showItem(it) {
  curItem = it;
  $('#qUnit').textContent = it.unit || '';
  $('#qYomi').textContent = it.yomi;
  $('#qYomi').style.animation = 'none'; void $('#qYomi').offsetWidth; $('#qYomi').style.animation = '';
  $('#qNote').innerHTML = maskNote(it.note, it.word, it.yomi);
  $('#reviewCard').hidden = true;
  $('#judgeBtn').hidden = $('#tools').hidden = false;
  const segs = KanjiData.parseWord(it.word);
  const kanji = segs.filter(s => s.type === 'kanji').map(s => s.ch);
  curTmpls = await Promise.all(kanji.map(ch => KanjiData.get(ch).catch(() => null)));
  if (curItem !== it) return false;
  pad.setWord(segs, curTmpls);
  return true;
}
function judgeCurrent() {
  if (!curItem || curTmpls.some(t => !t) || !pad.strokes.length) return null;
  pad.stopModel();
  const { strokes } = pad.strokesByCell();
  const r = KanjiJudge.judgeWord(strokes, curTmpls.map(t => t.lines), { tolerance: RULE.tolerance });
  pad.showResult(r);
  const kanji = [...curItem.word].filter(KanjiData.isKanji);
  r.msgList = r.chars.flatMap((c, k) => c.ok ? [] : c.msgs.map(m => (kanji.length > 1 ? `「${kanji[k]}」 ` : '') + m));
  logJudge(r);
  return r;
}

/* ===== 判定の記録（判定の厳しさを、実際の字で調整するため） ===== */
const JLOG = 'kanjiJudgeLog.v1', JLOG_MAX = 200;
function loadJLog() { try { return JSON.parse(localStorage.getItem(JLOG)) || []; } catch (e) { return []; } }
function saveJLog(l) { for (let n = JLOG_MAX; n >= 10; n = Math.floor(n / 2)) { try { localStorage.setItem(JLOG, JSON.stringify(l.slice(-n))); return; } catch (e) {} } }
function logJudge(r) {
  const l = loadJLog();
  l.push({ t: Date.now(), word: curItem.word, mode: R ? 'course:' + R.course.id : '', tol: RULE.tolerance, ok: r.ok, score: r.score,
    chars: r.chars.map(c => ({ ok: c.ok, score: c.score, reasons: c.reasons, cost: c.debug.map(d => +Math.min(d.cost, d.costRev).toFixed(3)) })),
    strokes: pad.strokes.map(st => st.filter((p, i) => i % 2 === 0 || i === st.length - 1).map(p => [+p.x.toFixed(3), +p.y.toFixed(3)])), box: pad.box });
  saveJLog(l);
}
function flagLast(btn) {
  const l = loadJLog(); if (!l.length) return;
  l[l.length - 1].flag = 'wrongNg'; saveJLog(l);
  btn.disabled = true; btn.textContent = '🙏 教えてくれてありがとう';
}
function renderLogLine() {
  const l = loadJLog();
  $('#logLine').textContent = `先生用：判定の記録 ${l.length}件（「正しく書いたのに❌」${l.filter(x => x.flag).length}件）`;
}

/* ================================================================
 * コース
 * ================================================================ */
let R = null;   // いまのコースの状態
function startCourse(u, course) {
  ac();
  const list = shuffle(u.all ? allWrite() : u.items.filter(i => i.kind === 'write').map(i => Object.assign({ unit: '' }, i))).slice(0, qCount(u));
  if (!list.length) return;
  const n = list.length, req = need(n, course);
  R = { unit: u, course, list, idx: 0, n, req, ok: 0, ng: 0, pts: 0, streak: 0, maxStreak: 0, gold: 0, log: [], busy: false, ended: false, failShown: false };
  $('#courseTag').textContent = `${course.medal} ${course.name}`;
  $('#score').textContent = '0';
  setFever(1); drawHearts(); drawGoal(); drawStreak();
  show('play');
  bigText(`${course.medal} ${course.name}`); tone(660, 0, .15, 'square', .08); tone(990, .12, .25, 'square', .08);
  nextQ();
}
async function nextQ() {
  if (!R) return;
  if (R.idx >= R.n) return finishCourse();
  $('#prog').textContent = `${R.idx + 1} / ${R.n}`;
  R.busy = true;
  const run = R;
  await showItem(R.list[R.idx]);
  if (R === run) R.busy = false;
}
// ハート = あと何問まちがえられるか
function drawHearts(lost) {
  const allow = R.n - R.req, left = allow - R.ng;
  const el = $('#hearts');
  el.textContent = allow === 0 ? (R.ng ? '💔' : '❤️ ノーミス!') : left < 0 ? '💔' : '❤️'.repeat(left) + '🤍'.repeat(R.ng);
  if (lost) FX.shake(el, 'lost');
}
function drawGoal() {
  const el = $('#goalLine'), left = R.req - R.ok;
  const failed = R.ng > R.n - R.req;
  el.classList.toggle('fail', failed);
  el.textContent = failed ? '💦 今回は クリアできないけど、さいごまで がんばろう!'
    : left <= 0 ? '🎉 クリア条件たっせい! のこりも がんばろう!'
    : `🏁 クリアまで あと ${left}問 正解（${R.n}問中 ${R.req}問）`;
}
// れんぞく → FEVER倍率
const feverMult = s => s < RULE.feverFrom ? 1 : Math.min(RULE.feverMax, 2 + Math.floor((s - RULE.feverFrom) / 2));
function setFever(m) {
  const on = m > 1;
  document.body.classList.toggle('fever', on);
  $('#feverBadge').hidden = !on;
  $('#streakHint').hidden = on || (R && R.streak > 0);
  if (on) $('#feverBadge').textContent = `🔥 FEVER ×${m}`;
}
function drawStreak(bump) {
  const el = $('#streak');
  el.textContent = R.streak >= 1 ? `${'🔥'.repeat(Math.min(R.streak, 5))} ${R.streak} れんぞく` : '';
  $('#streakHint').hidden = R.streak > 0 || feverMult(R.streak) > 1;
  if (bump) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
function judgeQ() {
  if (!R || R.busy || R.ended) return;
  const r = judgeCurrent(); if (!r) return;
  R.busy = true;
  const it = curItem, n = kanjiCount(it.word);
  if (r.ok) {
    const pct = r.score;
    R.ok++;
    const prevMult = feverMult(R.streak);
    R.streak = pct >= RULE.streakAt ? R.streak + 1 : 0;
    R.maxStreak = Math.max(R.maxStreak, R.streak);
    const fm = feverMult(R.streak);
    const rankMult = pct >= RULE.gold ? 3 : pct >= RULE.silver ? 2 : 1;
    if (pct >= RULE.gold) R.gold++;
    // 同じ日に同じ語は 2回目から 半分
    if (store.daily.date !== today()) store.daily = { date: today(), words: {} };
    const rep = store.daily.words[it.word] ? RULE.repeatRate : 1;
    store.daily.words[it.word] = (store.daily.words[it.word] || 0) + 1;
    const pts = Math.round(RULE.base * n * rankMult * fm * rep);
    R.pts += pts;
    R.log.push({ item: it, ok: true, pct, pts });
    setFever(fm); drawStreak(true); drawGoal();
    const parts = [rankMult > 1 ? `一致率 ${pct}% ×${rankMult}` : `一致率 ${pct}%`, fm > 1 ? `FEVER ×${fm}` : '', rep < 1 ? 'きょう2回目 ×½' : ''].filter(Boolean);
    $('#pop').innerHTML = `<div class="pts">+${pts.toLocaleString()}</div><div class="sub">${esc(parts.join('　'))}</div>`;
    const big = fm > prevMult;
    if (big) { bigText(prevMult === 1 ? '🔥 FEVER!' : `FEVER ×${fm}!`); prevMult === 1 ? SFX.fever() : SFX.up(); }
    else SFX.ok(fm);
    if (R.ok === R.req && R.ng <= R.n - R.req) { setTimeout(() => { bigText('🎉 クリア条件たっせい!'); SFX.clear(); FX.confetti(120); }, big ? 1100 : 300); }
    celebrate(pct, fm, pts, big);
    pad.locked = true;
    const run = R;
    setTimeout(() => { $('#pop').innerHTML = ''; if (R === run && !run.ended) { R.idx++; nextQ(); } }, 1150);
  } else {
    R.ng++; R.streak = 0;
    R.log.push({ item: it, ok: false, pct: 0, pts: 0 });
    SFX.ng(); FX.shake($('#padArea'));
    setFever(1); drawStreak(); drawHearts(true); drawGoal();
    const failedNow = R.ng === R.n - R.req + 1;
    $('#rvAnswer').innerHTML = `こたえ：<span style="font-family:'Klee One',serif;font-size:30px">${esc(it.word)}</span>`;
    $('#rvHeart').textContent = failedNow ? '💔 ハートがなくなった…　でも さいごまで 書いて れんしゅうしよう!' : (R.n - R.req - R.ng >= 0 ? `ハート のこり ${R.n - R.req - R.ng}` : '');
    fillList($('#rvMsgs'), r.msgList);
    $('#judgeBtn').hidden = $('#tools').hidden = true;
    $('#rvFlag').disabled = false; $('#rvFlag').textContent = '🙋 正しく書いたのに❌だった';
    $('#reviewCard').hidden = false;
    setTimeout(() => $('#reviewCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  }
}
// 正解の演出（一致率・倍率が高いほど派手に）
function celebrate(pct, fm, pts, big) {
  const padEl = $('#pad'), [x, y] = FX.center(padEl);
  FX.shake(padEl, 'fx-boing');
  FX.burst(x, y, 50 + fm * 25 + (pct >= 90 ? 40 : 0), 10 + fm * 2);
  const fw = (pct >= 90 ? 2 : pct >= 80 ? 1 : 0) + (fm > 1 ? fm - 1 : 0);
  for (let i = 0; i < fw; i++) setTimeout(() => { FX.firework(innerWidth * (.15 + Math.random() * .7), innerHeight * (.12 + Math.random() * .35)); tone(200 + Math.random() * 80, 0, .2, 'sine', .08); }, 150 + i * 170);
  if (pct >= 90) FX.emoji(x, y, ['⭐', '✨', '🌟', '💯', '🎉'], 8 + fm * 2);
  if (big) { FX.flash('#fff7c2'); FX.shake(document.body); FX.confetti(60 + fm * 20); }
  setTimeout(() => { FX.fly('+' + pts.toLocaleString(), padEl, $('#score')); }, 250);
  setTimeout(() => { const sc = $('#score'); FX.countUp(sc, R ? R.pts : 0, 500); sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }, 650);
}
// FEVER中は画面の端から火の粉
setInterval(() => { if (R && !R.ended && document.body.classList.contains('fever')) FX.sparks(4); }, 140);

/* ===== 結果 ===== */
function finishCourse() {
  const run = R; run.ended = true;
  setFever(1);
  const { unit: u, course: c } = run;
  const clear = run.ok >= run.req;
  const first = clear && !cleared(u.id, c.id);
  const before = rankOf(store.points);
  // クリアボーナス（はじめてのクリアは大きめ）
  const bonus = clear ? (first ? 1000 : 300) * (COURSES.indexOf(c) + 1) : 0;
  store.points += run.pts + bonus;
  if (clear) { store.clears[u.id] = store.clears[u.id] || {}; if (first) store.clears[u.id][c.id] = { date: shortDate() }; }
  const bk = u.id + ':' + c.id, prevBest = store.best[bk] || 0;
  if (run.ok > prevBest) store.best[bk] = run.ok;
  save();
  const after = rankOf(store.points);
  const nextCi = COURSES.indexOf(c) + 1;
  const news = [];
  if (first) news.push(`🆕 ${c.medal}「${c.name}」はじめて クリア!`);
  if (first && nextCi < COURSES.length) news.push(`🔓「${COURSES[nextCi].name}」コースが あそべるようになった!`);
  if (first && COURSES.every(x => cleared(u.id, x.id))) news.push(`👑 ${u.name} ぜんぶのコースを クリア!`);
  if (after !== before) news.push(`⬆ 称号アップ! ${after[1]}`);

  $('#sumTitle').textContent = `${u.name}　${c.medal} ${c.name}コース`;
  $('#sumMedal').hidden = !clear; $('#sumMedal').textContent = c.medal;
  $('#sumBig').className = clear ? '' : 'fail';
  $('#sumBig').textContent = clear ? 'クリア!' : `おしい! あと${run.req - run.ok}問`;
  $('#sumNews').innerHTML = news.map((t, i) => `<div style="animation-delay:${.6 + i * .3}s">${esc(t)}</div>`).join('');
  $('#sumStats').innerHTML = `<div>⭕ 正解 ${run.ok} / ${run.n}</div><div>🏁 クリア条件 ${run.req}問</div><div>🥇 90%以上 ${run.gold}</div><div>🔥 最高 ${run.maxStreak}れんぞく</div>`;
  $('#sumPts').innerHTML = `⭐ +<span id="sumPtsNum">0</span>点${bonus ? `<small style="font-size:16px">（クリアボーナス ${bonus.toLocaleString()}点 ふくむ）</small>` : ''}`;
  const box = $('#sumList'); box.innerHTML = '';
  run.log.forEach((l, i) => {
    const d = document.createElement('div'); d.className = 'si'; d.style.animationDelay = (i * .04) + 's';
    d.innerHTML = `<div><div class="w">${esc(l.item.word)}</div><div class="y">${esc(l.item.yomi)}</div></div><div class="r">${l.ok ? `⭕ ${l.pct}%<br>+${l.pts.toLocaleString()}` : '❌'}</div>`;
    box.appendChild(d);
  });
  $('#sumAgain').onclick = () => startCourse(u, c);
  $('#sumNext').hidden = !(clear && nextCi < COURSES.length);
  $('#sumNext').textContent = nextCi < COURSES.length ? `▶ ${COURSES[nextCi].medal}「${COURSES[nextCi].name}」へ` : '';
  $('#sumNext').onclick = () => { store.opt.course = COURSES[nextCi].id; save(); startCourse(u, COURSES[nextCi]); };
  show('summary');
  FX.countUp($('#sumPtsNum'), run.pts + bonus, 1200, 0);
  if (clear) {
    SFX.clear(); FX.confetti(first ? 260 : 140);
    for (let i = 0; i < (first ? 7 : 3); i++) setTimeout(() => FX.firework(innerWidth * (.1 + Math.random() * .8), innerHeight * (.1 + Math.random() * .4), 90), 300 + i * 280);
    if (first) setTimeout(() => bigText('🎉 はじめてクリア!'), 900);
  } else SFX.fail();
}

/* ===== ボタン ===== */
$('#undoBtn').onclick = () => pad.undo();
$('#clearBtn').onclick = () => pad.clear();
$('#judgeBtn').onclick = judgeQ;
$('#rvFlag').onclick = () => flagLast($('#rvFlag'));
$('#rvAnim').onclick = () => { pad.clearResult(); pad.animateModel(); };
$('#rvReplay').onclick = () => { pad.stopModel(); pad.replay(); };
$('#rvNext').onclick = () => { if (!R) return; pad.stopModel(); $('#reviewCard').hidden = true; R.idx++; nextQ(); };
$('#quitBtn').onclick = () => {
  $('#dlgMsg').textContent = 'やめる？';
  $('#dlgSub').textContent = '（このコースの点数は記録されません）';
  $('#dlgYes').textContent = 'やめる'; $('#dlg').hidden = false;
  $('#dlgYes').onclick = () => { $('#dlg').hidden = true; pad.stopModel(); if (R) R.ended = true; R = null; setFever(1); $('#bigText').innerHTML = ''; renderHome(); show('home'); };
  $('#dlgNo').onclick = () => { $('#dlg').hidden = true; };
};
$('#logSave').onclick = () => {
  const blob = new Blob([JSON.stringify({ app: 'kanji-practice', v: 1, saved: new Date().toISOString(), ua: navigator.userAgent, log: loadJLog() })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `kanji-judge-log-${new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '')}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#logClear').onclick = () => {
  $('#dlgMsg').textContent = '判定の記録を消す？'; $('#dlgSub').textContent = '（先に「記録を保存」をしておいてください）';
  $('#dlgYes').textContent = '消す'; $('#dlg').hidden = false;
  $('#dlgYes').onclick = () => { saveJLog([]); $('#dlg').hidden = true; renderLogLine(); };
  $('#dlgNo').onclick = () => { $('#dlg').hidden = true; };
};
$('#sumHome').onclick = () => { R = null; renderHome(); show('home'); };
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if ($('#play').classList.contains('on')) pad.layout(); }, 200); });

window.__practice = { pad, get R() { return R; }, store, startCourse, maskNote, RULE, COURSES, UNITS };
renderHome();
</script>
</body>
</html>
