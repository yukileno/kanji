<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>判定の確認（先生用）</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "M PLUS Rounded 1c", system-ui, sans-serif; background: #f1f5f9; color: #1e293b; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: #1e293b; color: #fff; }
header h1 { margin: 0; font-size: 18px; }
header .tag { background: #f59e0b; color: #1e293b; font-weight: 800; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
header a { color: #93c5fd; font-weight: 800; font-size: 14px; margin-left: auto; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; padding: 14px 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.card { background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 3px #0001; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, input, button { font: inherit; font-size: 15px; }
select, input { padding: 6px 10px; border: 2px solid #cbd5e1; border-radius: 10px; background: #fff; }
button { border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 800; cursor: pointer; background: #e2e8f0; color: #1e293b; }
button.main { background: #2563eb; color: #fff; font-size: 18px; padding: 10px 26px; }
button:active { transform: translateY(1px); }
#yomi { font-size: 40px; font-weight: 800; text-align: center; margin: 6px 0 2px; letter-spacing: .06em; }
#note { text-align: center; color: #64748b; font-weight: 800; min-height: 1.4em; }
#padArea { display: flex; justify-content: center; align-items: center; height: min(52vh, 460px); margin: 8px 0; }
.wpad { position: relative; background: #fff; border-radius: 16px; box-shadow: 0 0 0 3px #cbd5e1; }
.wpad canvas { position: absolute; inset: 0; border-radius: 16px; }
.wpad canvas:last-child { touch-action: none; cursor: crosshair; }
.res { border: 3px solid #e2e8f0; border-radius: 12px; padding: 8px 10px; margin-top: 10px; }
.courses { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0; }
.courses span { background: #f1f5f9; border-radius: 999px; padding: 3px 12px; font-weight: 800; font-size: 14px; }
.res h3 { margin: 0 0 4px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
.res .big { font-size: 30px; font-weight: 800; }
.res.ok { border-color: #22c55e; background: #f0fdf4; }
.res.ng { border-color: #ef4444; background: #fef2f2; }
.res ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; }
.hint { font-size: 13px; color: #64748b; margin: 6px 0 0; line-height: 1.6; }
#sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin-bottom: 8px; }
#sum div { background: #f1f5f9; border-radius: 10px; padding: 6px 4px; font-size: 12px; font-weight: 800; }
#sum b { display: block; font-size: 22px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 5px 4px; border-bottom: 1px solid #e2e8f0; text-align: center; }
td.w { font-family: "Klee One", serif; font-size: 18px; }
#logWrap { max-height: 50vh; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>判定の確認（先生用）</h1>
  <a href="index.html">アプリを開く →</a>
</header>
<main>
  <section>
    <div class="card">
      <div class="row">
        <select id="unitSel"></select>
        <select id="wordSel"></select>
        <button id="prevBtn">◀</button><button id="nextBtn">▶</button>
        <button id="randBtn">🎲 ランダム</button>
        <span style="flex:1"></span>
        <input id="freeWord" placeholder="好きな漢字を試す" size="10"><button id="freeBtn">試す</button>
      </div>
      <div id="yomi"></div>
      <div id="note"></div>
      <div id="padArea"><div id="pad"></div></div>
      <div class="row" style="justify-content:center">
        <button id="undoBtn">↩ もどす</button>
        <button id="clearBtn">🧽 けす</button>
        <button id="modelBtn">👀 お手本</button>
        <button id="animBtn">▶ 書き順</button>
        <button class="main" id="judgeBtn">判定</button>
      </div>
      <div class="res" id="res">
        <h3>判定（激激甘）</h3>
        <div class="big">—</div>
        <div class="courses" id="courses"></div>
        <ul></ul>
      </div>
      <p class="hint">
        アプリと同じ判定です。形の判定は全コース共通で「激激甘」：画数・書き順・向き・だいたいの形を見ます（線の長さ・「土/士」のような長さ関係は見ません）。<br>
        そのうえで、コースごとに一致率（ていねいさ）の基準があります：<span id="ruleText"></span>
      </p>
    </div>
  </section>
  <aside class="card">
    <div id="sum"></div>
    <div id="logWrap">
      <table><thead><tr><th>語</th><th>形</th><th>一致率</th><th>🥉</th><th>🥈</th><th>🥇</th></tr></thead><tbody id="log"></tbody></table>
    </div>
    <p class="hint">右の数は、各コースで⭕になった数です。この記録はページを閉じると消えます。</p>
  </aside>
</main>

<script src="data/tests-g5-t2.js?v=20261005c"></script>
<script src="js/kanji-data.js?v=20261005c"></script>
<script src="js/judge.js?v=20261005c"></script>
<script src="js/pad.js?v=20261005c"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// index.html の RULE.tolerance・COURSES と同じ値にしておく
const TOLERANCE = 'ultraEasy';
const COURSES = [
  { name: 'かんたん', medal: '🥉', minPct: 0 },
  { name: 'ふつう', medal: '🥈', minPct: 70 },
  { name: 'むずかしい', medal: '🥇', minPct: 80 },
];
const pass = (r, c) => r.ok && r.score >= c.minPct;
const pad = new WritingPad($('#pad'), { penMode: 'auto', fitHeight: true, maxBox: 420 });
const units = window.KANJI_TESTS.units;
let cur = null, tmpls = [], result = null;
const stats = { n: 0, c: COURSES.map(() => 0) };
$('#ruleText').textContent = COURSES.map(c => `${c.medal}${c.name} ${c.minPct ? c.minPct + '%以上' : 'なし'}`).join('　');

units.forEach((u, i) => $('#unitSel').add(new Option(u.name, i)));
function fillWords() {
  const u = units[$('#unitSel').value];
  $('#wordSel').innerHTML = '';
  u.items.forEach((it, i) => $('#wordSel').add(new Option(`${it.n}. ${it.yomi}（${it.word}）${it.kind === 'read' ? ' [読む問題]' : ''}`, i)));
}
function fromSelect() { const u = units[$('#unitSel').value]; load(u.items[$('#wordSel').value]); }
function step(d) {
  const ws = $('#wordSel'), us = $('#unitSel');
  let w = +ws.value + d, u = +us.value;
  if (w < 0) { u = (u - 1 + units.length) % units.length; us.value = u; fillWords(); w = ws.options.length - 1; }
  else if (w >= ws.options.length) { u = (u + 1) % units.length; us.value = u; fillWords(); w = 0; }
  ws.value = w; fromSelect();
}

async function load(it) {
  cur = it; result = null;
  $('#yomi').textContent = it.yomi;
  $('#note').textContent = it.note ? '例：' + it.note : '';
  showRes();
  const segs = KanjiData.parseWord(it.word);
  const ks = segs.filter(s => s.type === 'kanji').map(s => s.ch);
  const ts = await Promise.all(ks.map(ch => KanjiData.get(ch).catch(() => null)));
  if (cur !== it) return;
  tmpls = ts;
  const missing = ks.filter((_, i) => !ts[i]);
  if (missing.length) $('#note').textContent = `「${missing.join('')}」の書き順データがないので判定できません`;
  pad.setWord(segs, ts);
}

function judge() {
  if (!cur || tmpls.some(t => !t) || !pad.strokes.length) return;
  pad.stopModel();
  const { strokes } = pad.strokesByCell();
  const ks = [...cur.word].filter(KanjiData.isKanji);
  const r = KanjiJudge.judgeWord(strokes, tmpls.map(t => t.lines), { tolerance: TOLERANCE });
  r.msgList = r.chars.flatMap((c, k) => c.ok ? [] : c.msgs.map(m => (ks.length > 1 ? `「${ks[k]}」 ` : '') + m));
  result = r;
  showRes();
  stats.n++; COURSES.forEach((c, i) => { if (pass(r, c)) stats.c[i]++; });
  drawSum();
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="w">${esc(cur.word)}</td><td>${r.ok ? '⭕' : '❌'}</td><td>${r.score}%</td>` + COURSES.map(c => `<td>${pass(r, c) ? '⭕' : '❌'}</td>`).join('');
  $('#log').prepend(tr);
}
function drawSum() {
  $('#sum').innerHTML = `<div>判定した数<b>${stats.n}</b></div>` + COURSES.map((c, i) => `<div>${c.medal}${c.name}<b>${stats.c[i]}</b></div>`).join('');
}

function showRes() {
  const el = $('#res'), r = result;
  el.className = 'res' + (r ? (r.ok ? ' ok' : ' ng') : '');
  el.querySelector('.big').textContent = r ? `形・書き順 ${r.ok ? '⭕' : '❌'}　一致率 ${r.score}%` : '—';
  $('#courses').innerHTML = r ? COURSES.map(c => `<span>${c.medal}${c.name} ${pass(r, c) ? '⭕' : '❌'}</span>`).join('') : '';
  const ul = el.querySelector('ul'); ul.innerHTML = '';
  if (r) for (const m of (r.ok ? ['形・書き順は問題なし'] : r.msgList)) { const li = document.createElement('li'); li.textContent = m; ul.appendChild(li); }
  if (r) pad.showResult(r);
}

$('#unitSel').onchange = () => { fillWords(); fromSelect(); };
$('#wordSel').onchange = fromSelect;
$('#prevBtn').onclick = () => step(-1);
$('#nextBtn').onclick = () => step(1);
$('#randBtn').onclick = () => {
  const u = Math.floor(Math.random() * units.length);
  $('#unitSel').value = u; fillWords();
  $('#wordSel').value = Math.floor(Math.random() * units[u].items.length); fromSelect();
};
$('#freeBtn').onclick = () => {
  const w = $('#freeWord').value.trim();
  if (w && [...w].some(KanjiData.isKanji)) load({ word: w, yomi: w });
};
$('#freeWord').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) $('#freeBtn').click(); };
$('#undoBtn').onclick = () => { pad.undo(); result = null; showRes(); };
$('#clearBtn').onclick = () => { pad.clear(); result = null; showRes(); };
$('#modelBtn').onclick = () => pad.toggleModel();
$('#animBtn').onclick = () => pad.animateModel();
$('#judgeBtn').onclick = judge;
addEventListener('resize', () => pad.layout());

drawSum(); fillWords(); fromSelect();
</script>
</body>
</html>
